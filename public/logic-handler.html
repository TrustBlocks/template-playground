<!doctype html>
<html lang="en">
  <head>
    <meta
      charset="UTF-8"
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:"
    />
    <title>Logic Sandbox</title>
  </head>
  <body>
    <script>
      /*
       * Logic Sandbox Handler -- Trustblocks
       *
       * This page runs inside a sandboxed iframe with "allow-scripts" only
       * (no "allow-same-origin"). The browser assigns it a null origin,
       * isolating it from the parent application's DOM, storage, and memory.
       *
       * The logic is Clojure, run by Trustblocks' clause runtime --
       * trustblocks-logic.js, built from trustblocks-templates' runtime/ --
       * which is itself a sandbox: an SCI interpreter holding only the
       * clause vocabulary, with no clock, I/O or interop.
       *
       *   1. The parent sends the runtime's source once ("load-runtime"); it
       *      cannot be loaded by URL under this page's policy
       *   2. This handler starts a Blob-based Web Worker holding the runtime,
       *      which defines TrustblocksLogic in the worker
       *   3. Each "execute" message names a method -- check, nextSteps or
       *      trigger -- and its arguments; the worker calls it
       *   4. A timeout kill-switch terminates a runaway execution, and a
       *      fresh worker takes its place
       *   5. Results (or errors) are relayed back to the parent via postMessage
       */

      "use strict";

      const EXECUTION_TIMEOUT_MS = 5000;
      const METHODS = ["check", "nextSteps", "trigger"];

      const WORKER_HANDLER = [
        "self.onmessage = function (e) {",
        "  const { id, method, args } = e.data;",
        "  try {",
        "    const api = self.TrustblocksLogic;",
        "    if (!api || typeof api[method] !== 'function') {",
        "      throw new Error('The logic runtime has no ' + method);",
        "    }",
        "    const result = api[method].apply(null, args);",
        "    self.postMessage({ id, success: true, result: result === undefined ? null : result });",
        "  } catch (err) {",
        "    self.postMessage({ id, success: false, error: err instanceof Error ? err.message : String(err) });",
        "  }",
        "};",
      ].join("\n");

      let runtimeSource = null;
      let worker = null;
      const pending = new Map(); // executionId -> timeout handle

      const reply = (response) => {
        /*
         * Post to parent with '*' because this iframe has a null origin
         * (sandbox="allow-scripts" without allow-same-origin). A null-origin
         * iframe cannot specify a concrete targetOrigin -- '*' is the only
         * viable option here. Security is enforced on the receiving side by
         * checking event.origin === 'null'.
         */
        window.parent.postMessage(response, "*");
      };

      const settle = (executionId, outcome) => {
        const timeout = pending.get(executionId);
        if (timeout === undefined) return; // already settled (timed out)
        clearTimeout(timeout);
        pending.delete(executionId);
        reply({ type: "execution-result", executionId, ...outcome });
      };

      const startWorker = () => {
        const url = URL.createObjectURL(
          new Blob([runtimeSource, "\n;\n", WORKER_HANDLER], { type: "application/javascript" }),
        );
        worker = new Worker(url);
        URL.revokeObjectURL(url);
        worker.onmessage = (e) =>
          settle(e.data.id, { success: e.data.success, result: e.data.result, error: e.data.error });
        worker.onerror = (e) => {
          e.preventDefault();
          for (const id of [...pending.keys()]) {
            settle(id, { success: false, error: e.message || "The logic worker failed" });
          }
        };
      };

      window.addEventListener("message", (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== "object") return;

        if (msg.type === "load-runtime" && typeof msg.source === "string") {
          runtimeSource = msg.source;
          if (worker) worker.terminate();
          startWorker();
          reply({ type: "runtime-loaded" });
          return;
        }

        if (
          msg.type === "execute" &&
          typeof msg.executionId === "number" &&
          METHODS.includes(msg.method) &&
          Array.isArray(msg.args)
        ) {
          const executionId = msg.executionId;
          if (!worker) {
            reply({ type: "execution-result", executionId, success: false,
                    error: "The logic runtime is not loaded" });
            return;
          }
          pending.set(executionId, setTimeout(() => {
            // A runaway clause: kill the worker, and start a fresh one.
            worker.terminate();
            startWorker();
            settle(executionId, { success: false,
                                  error: "Execution timed out after " + EXECUTION_TIMEOUT_MS + "ms" });
          }, EXECUTION_TIMEOUT_MS));
          worker.postMessage({ id: executionId, method: msg.method, args: msg.args });
        }
      });

      /*
       * Signal readiness to the parent application, which answers with the
       * runtime. Uses '*' for the same reason as reply() above.
       */
      window.parent.postMessage({ type: "sandbox-ready" }, "*");
    </script>
  </body>
</html>
